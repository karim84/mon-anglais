<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon anglais</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon anglais">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --paper:#FCFCF9; --text:#1C2230; --muted:#5B6474;
  --ink:#1D3C8F; --ink-soft:#E3EAF8; --line:#CFDDF0; --line-strong:#A3BEE2; --margin:#D4435B;
  --good:#2C7A4B; --good-soft:#E2F2E8; --bad:#C23A50; --bad-soft:#FBE6EA; --border:#D9DFE8;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151F; --surface:#1C2230; --paper:#1A2030; --text:#E8EBF1; --muted:#A1A9B8;
    --ink:#A4BCFF; --ink-soft:#26304A; --line:#28324A; --line-strong:#38466A; --margin:#E46C80;
    --good:#62C98F; --good-soft:#1C3328; --bad:#F07A8D; --bad-soft:#3A1F27; --border:#2E3647;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151F; --surface:#1C2230; --paper:#1A2030; --text:#E8EBF1; --muted:#A1A9B8;
  --ink:#A4BCFF; --ink-soft:#26304A; --line:#28324A; --line-strong:#38466A; --margin:#E46C80;
  --good:#62C98F; --good-soft:#1C3328; --bad:#F07A8D; --bad-soft:#3A1F27; --border:#2E3647;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.hand{font-family:"Caveat","Segoe Print","Bradley Hand",cursive}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 20px 10px}
.head-inner{max-width:640px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:"Caveat",cursive;font-weight:700;font-size:2.1rem;line-height:1;margin:0;color:var(--ink)}
.stats{font-size:.88rem;color:var(--muted);text-align:right}
.stats strong{color:var(--text)}

main{max-width:640px;margin:0 auto;padding:8px 20px 110px}
section[hidden]{display:none}
h2{font-size:1.25rem;margin:8px 0 12px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.btn{border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1}

/* The notebook card — the one bold element */
.card{position:relative;background-color:var(--paper);
  background-image:linear-gradient(var(--line-strong) 1px,transparent 1px),linear-gradient(var(--line) 1px,transparent 1px);
  background-size:100% 36px,100% 9px;background-position:0 8px,0 8px;
  border-radius:6px 18px 18px 6px;border:1px solid var(--border);
  padding:26px 22px 26px 64px;min-height:300px;display:flex;flex-direction:column;justify-content:center;
  cursor:pointer;user-select:none;box-shadow:0 1px 0 var(--border)}
.card::before{content:"";position:absolute;top:0;bottom:0;left:46px;width:2px;background:var(--margin);opacity:.8}
.card .en{font-family:"Caveat",cursive;font-weight:700;font-size:clamp(2.4rem,9vw,3.4rem);line-height:1.05;color:var(--ink);margin:0}
.card .fr{font-size:1.3rem;font-weight:700;margin:18px 0 6px}
.card .ex{font-family:"Caveat",cursive;font-size:1.55rem;line-height:1.2;color:var(--ink);opacity:.85;margin:0}
.card .hint{position:absolute;bottom:12px;right:18px;font-size:.85rem;color:var(--muted)}
.card .say{position:absolute;top:12px;right:12px}
.icon-btn{border:1.5px solid var(--border);background:var(--surface);border-radius:999px;width:44px;height:44px;display:inline-grid;place-items:center;font-size:1.1rem;padding:0}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.progress > i{display:block;height:100%;background:var(--ink);transition:width .25s}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.grades .btn{padding:10px 6px;font-size:.95rem;line-height:1.2}
.grades .btn span{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
.g-again{border-color:var(--bad)!important;color:var(--bad)}
.g-easy{background:var(--ink)!important;border-color:var(--ink)!important;color:var(--surface)!important}
.g-easy span{color:inherit!important;opacity:.8}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}
.empty{text-align:center;padding:32px 18px}
.empty .big{font-family:"Caveat",cursive;font-size:2.4rem;color:var(--ink);line-height:1;margin-bottom:8px}

/* Quiz */
.q-prompt{font-size:.9rem;color:var(--muted);margin-bottom:4px}
.q-word{font-family:"Caveat",cursive;font-weight:700;font-size:2.6rem;line-height:1.1;color:var(--ink);margin:0 0 16px}
.options{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:14px 16px;min-height:52px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.score{font-family:"Caveat",cursive;font-size:4rem;line-height:1;color:var(--ink)}

/* Words */
label{display:block;font-size:.9rem;font-weight:700;margin:10px 0 4px}
input[type=text],input[type=search],select,textarea{width:100%;border:1.5px solid var(--border);background:var(--bg);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{resize:vertical;min-height:52px}
.words{list-style:none;margin:0;padding:0}
.words li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.words li:last-child{border-bottom:0}
.words .w{flex:1;min-width:0}
.words .w b{font-family:"Caveat",cursive;font-size:1.6rem;line-height:1;color:var(--ink);font-weight:700}
.words .w div{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
.dots i.on{background:var(--good)}
.del{border:0;background:transparent;color:var(--muted);font-size:1.3rem;width:40px;height:40px;border-radius:999px}
.gen-list{list-style:none;padding:0;margin:12px 0}
.gen-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.gen-list input{margin-top:6px;width:20px;height:20px}

/* Chat */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.chip{border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.92rem}
.chip.on{background:var(--ink-soft);border-color:var(--ink);color:var(--ink);font-weight:700}
.chat{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;overflow-wrap:anywhere}
.msg.tutor{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--surface);border-bottom-right-radius:4px}
.msg .tools{display:flex;gap:12px;margin-top:8px}
.linkish{border:0;background:none;padding:4px 0;color:var(--ink);font-size:.88rem;font-weight:700}
.trans{margin-top:6px;color:var(--muted);font-size:.92rem}
.fix{align-self:flex-end;max-width:88%;background:var(--good-soft);border:1px solid var(--good);border-radius:12px;padding:10px 12px;font-size:.92rem}
.fix b{display:block;color:var(--good)}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1}
.err{color:var(--bad);font-size:.92rem;margin:8px 0}

.lvl{display:inline-block;font-size:.72rem;font-weight:700;color:var(--ink);background:var(--ink-soft);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:middle}
.levels{display:grid;gap:10px}
.level-opt{display:flex;gap:14px;align-items:center;text-align:left;border:1.5px solid var(--border);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:60px}
.level-opt .code{font-family:"Caveat",cursive;font-weight:700;font-size:2rem;line-height:1;color:var(--ink);min-width:44px}
.level-opt small{display:block;color:var(--muted);font-size:.85rem}
.lessons{display:grid;gap:10px;margin-bottom:16px}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:14px 16px;min-height:64px}
.lesson small{display:block;color:var(--muted);font-size:.85rem;font-weight:400}
.gscore{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
.gscore.full{color:var(--good)}
.examples{background:var(--paper);border-left:3px solid var(--margin);border-radius:4px 10px 10px 4px;padding:8px 12px;margin-top:8px}
.exl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.exl .hand{font-size:1.5rem;line-height:1.15;color:var(--ink)}
details.list{border-top:1px solid var(--border)}
details.list summary{display:flex;align-items:center;gap:10px;padding:13px 0;cursor:pointer;font-weight:700;list-style:none}
details.list summary::-webkit-details-marker{display:none}
details.list summary span:first-child{flex:1}
details.list summary::after{content:"▾";color:var(--muted)}
details.list[open] summary::after{content:"▴"}
.mini{list-style:none;padding:0;margin:0 0 12px}
.mini li{padding:3px 0;font-size:.95rem}
.mini .hand{font-size:1.35rem;color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:none;padding:10px 2px 12px;font-size:.74rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
nav button .ic{font-size:1.3rem;line-height:1}
nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--margin);color:#fff;font-size:.7rem;line-height:18px;margin-left:2px}
.sync{font-size:.8rem;color:var(--muted);text-align:center;margin-top:20px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

};
const LS_KEY = 'mon-anglais-v1';

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const mkWord = (en, fr, ex, lvl) => ({ id: uid(), en, fr, ex: ex || '', box: 0, due: 0, seen: 0, lvl: lvl || '' });
const freshState = () => ({
  v: 2, updatedAt: Date.now(), words: [], packs: [], grammar: {},
  stats: { streak: 0, lastDay: null, todayDay: null, todayCount: 0 },
  settings: { accent: 'en-GB', level: null }
});
function migrate(s){
  if (!s || !s.words) return null;
  if (!s.packs) s.packs = [];
  if (!s.grammar) s.grammar = {};
  if (!s.settings) s.settings = { accent: 'en-GB', level: null };
  const map = { 'Débutant': 'A2', 'Intermédiaire': 'B1', 'Avancé': 'B2' };
  if (map[s.settings.level]) s.settings.level = map[s.settings.level];
  if ((s.v || 1) < 2){
    const b1 = new Set(PACKS.B1.map(w => w[0]));
    s.words.forEach(w => { if (!w.lvl && b1.has(w.en)) w.lvl = 'B1'; });
    if (s.words.some(w => w.lvl === 'B1') && !s.packs.includes('B1')) s.packs.push('B1');
    s.v = 2;
  }
  return s;
}
function addPack(l){
  const have = new Set(state.words.map(w => w.en.toLowerCase()));
  let n = 0;
  PACKS[l].forEach(w => { if (!have.has(w[0].toLowerCase())){ state.words.push(mkWord(w[0], w[1], w[2], l)); n++; } });
  if (!state.packs.includes(l)) state.packs.push(l);
  return n;
}
function addWords(list, l){
  const have = new Set(state.words.map(w => w.en.toLowerCase()));
  let n = 0;
  list.forEach(w => { const k = w[0].toLowerCase(); if (!have.has(k)){ state.words.push(mkWord(w[0], w[1], w[2], l)); have.add(k); n++; } });
  return n;
}
function lvl(){ return state.settings.level || 'B1'; }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = t => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };
const $ = id => document.getElementById(id);

// ---------- Stockage ----------
function loadLocal(){ try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
let state = migrate(loadLocal()) || freshState();
let ref = null, saving = false, pending = false, saveTimer = null;

function save(){
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  if (ref){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 800); }
  renderStats();
}
async function flush(){
  if (!ref) return;
  if (saving){ pending = true; return; }
  saving = true;
  try { await ref.set({ state: JSON.parse(JSON.stringify(state)) }); setSync('Progression synchronisée sur ton compte Claude.'); }
  catch(e){ setSync('Synchronisation impossible pour le moment. Ta progression reste enregistrée sur cet appareil.'); }
  saving = false;
  if (pending){ pending = false; flush(); }
}
function setSync(t){ $('sync').textContent = t; }
setSync('Version hors ligne. Ta progression est enregistrée sur cet appareil.');

async function initRemote(){
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const r = db.collection('data/users/' + id).doc('progress');
    const snap = await r.get();
    ref = r;
    const remote = snap.exists ? (snap.data() || {}).state : null;
    if (remote && remote.words && (remote.updatedAt || 0) >= (state.updatedAt || 0)){
      state = migrate(JSON.parse(JSON.stringify(remote))) || state;
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
      session = null; quiz = null;
      renderAll();
      setSync('Progression synchronisée sur ton compte Claude.');
    } else {
      flush();
    }
  } catch(e){ /* reste en local */ }
}

// ---------- Voix ----------
function speak(text){
  if (!('speechSynthesis' in window) || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = state.settings.accent;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace('_','-').toLowerCase().startsWith(state.settings.accent.toLowerCase()));
  if (v) u.voice = v;
  u.rate = 0.92;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
const canSpeak = 'speechSynthesis' in window;

// ---------- Stats ----------
function dueWords(){ const now = Date.now(); return state.words.filter(w => w.due <= now); }
function markActivity(){
  const today = ymd(Date.now()), yesterday = ymd(Date.now() - DAY), s = state.stats;
  if (s.lastDay !== today){ s.streak = (s.lastDay === yesterday) ? s.streak + 1 : 1; s.lastDay = today; }
  if (s.todayDay !== today){ s.todayDay = today; s.todayCount = 0; }
  s.todayCount++;
}
function renderStats(){
  const s = state.stats, today = ymd(Date.now()), yesterday = ymd(Date.now() - DAY);
  const streak = (s.lastDay === today || s.lastDay === yesterday) ? s.streak : 0;
  const count = s.todayDay === today ? s.todayCount : 0;
  $('stats').innerHTML = (state.settings.level ? 'Niveau <strong>' + state.settings.level + '</strong><br>' : '') + '<strong>' + streak + '</strong> jour' + (streak > 1 ? 's' : '') + ' de suite<br><strong>' + count + '</strong> révision' + (count > 1 ? 's' : '') + ' aujourd’hui';
  const n = dueWords().length;
  $('due-badge').innerHTML = n ? '<span class="badge">' + (n > 99 ? '99+' : n) + '</span>' : '';
}

// ---------- Onglets ----------
const TABS = ['reviser','quiz','grammaire','mots','parler'];
let current = 'reviser';
function show(tab){
  if (!TABS.includes(tab)) tab = 'reviser';
  current = tab;
  TABS.forEach(t => { $('tab-' + t).hidden = t !== tab; });
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  render(tab);
  window.scrollTo(0, 0);
}
function render(tab){ ({ reviser: renderReview, quiz: renderQuiz, grammaire: renderGrammar, mots: renderWords, parler: renderChat })[tab](); }
function renderAll(){ renderStats(); render(current); }
document.querySelector('nav').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) show(b.dataset.tab); });
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.includes(t) && t !== current) show(t); });

// ---------- Révision ----------
let session = null;
function startSession(){
  const due = dueWords();
  const old = due.filter(w => w.seen > 0).sort((a,b) => a.due - b.due);
  const fresh = due.filter(w => w.seen === 0).slice(0, 8);
  const queue = old.concat(fresh).slice(0, 20).map(w => w.id);
  session = { queue, idx: 0, revealed: false, total: queue.length, done: 0 };
}
function renderReview(){
  const el = $('tab-reviser');
  if (placement){ el.innerHTML = placementHTML(); return; }
  if (!state.settings.level){ el.innerHTML = levelPicker(); return; }
  if (!session || session.idx >= session.queue.length){
    if (session && session.done > 0){
      el.innerHTML = '<div class="panel empty"><div class="big">Bien joué !</div><p>' + session.done + ' carte' + (session.done > 1 ? 's' : '') + ' révisée' + (session.done > 1 ? 's' : '') + '. Les mots reviendront au bon moment.</p>' + nextInfo() +
        '<div class="row" style="margin-top:16px">' + (dueWords().length ? '<button class="btn primary" data-act="start">Continuer (' + dueWords().length + ')</button>' : '') + '<button class="btn" data-act="goto" data-to="quiz">Faire un quiz</button></div></div>';
      return;
    }
    const n = dueWords().length;
    if (!n){
      el.innerHTML = '<div class="panel empty"><div class="big">Tout est à jour</div><p>Aucun mot à réviser pour le moment.</p>' + nextInfo() +
        '<div class="row" style="margin-top:16px"><button class="btn" data-act="goto" data-to="quiz">Faire un quiz</button><button class="btn" data-act="goto" data-to="mots">Ajouter des mots</button></div></div>';
      return;
    }
    startSession();
  }
  const w = state.words.find(x => x.id === session.queue[session.idx]);
  if (!w){ session.idx++; return renderReview(); }
  const pct = Math.round(100 * session.done / Math.max(1, session.total));
  el.innerHTML =
    '<div class="progress" aria-hidden="true"><i style="width:' + pct + '%"></i></div>' +
    '<div class="card" data-act="reveal" role="button" tabindex="0" aria-label="Retourner la carte">' +
      (canSpeak ? '<button class="icon-btn say" data-act="say" data-text="' + esc(w.en) + '" aria-label="Écouter">🔊</button>' : '') +
      '<p class="en">' + esc(w.en) + '</p>' +
      (session.revealed
        ? '<p class="fr">' + esc(w.fr) + '</p>' + (w.ex ? '<p class="ex">' + esc(w.ex) + '</p>' : '')
        : '<span class="hint">Touche pour voir la traduction</span>') +
    '</div>' +
    (session.revealed
      ? '<div class="grades">' +
          '<button class="btn g-again" data-act="grade" data-g="again">Je ne savais pas<span>dans 1 min</span></button>' +
          '<button class="btn" data-act="grade" data-g="hard">Difficile<span>' + label(planned(w,'hard')) + '</span></button>' +
          '<button class="btn g-easy" data-act="grade" data-g="easy">Facile<span>' + label(planned(w,'easy')) + '</span></button>' +
        '</div>'
      : '<div class="row" style="margin-top:14px"><button class="btn primary" data-act="reveal">Voir la traduction</button></div>') +

function planned(w, g){

  const future = state.words.filter(w => w.due > Date.now()).map(w => w.due).sort((a,b) => a - b)[0];

  const d = Math.round((future - Date.now()) / DAY);
  return '<p class="muted small">Prochaine révision : ' + (d < 1 ? 'aujourd’hui, un peu plus tard' : d === 1 ? 'demain' : 'dans ' + d + ' jours') + '.</p>';

function grade(g){
  const w = state.words.find(x => x.id === session.queue[session.idx]);
  const now = Date.now();
  w.seen++;
  if (g === 'again'){ w.box = 0; w.due = now + 60000; session.queue.push(w.id); }
  else if (g === 'hard'){ const d = planned(w, 'hard'); w.box = Math.max(1, w.box); w.due = now + d * DAY; session.done++; }
  else { const d = planned(w, 'easy'); w.box = Math.min(INTERVALS.length - 1, w.box + 1); w.due = now + d * DAY; session.done++; }

  session.idx++; session.revealed = false;

}

    }
    const q = ex.qs[ex.i];
    el.innerHTML = '<div class="progress" aria-hidden="true"><i style="width:' + Math.round(100 * ex.i / n) + '%"></i></div>' +
      '<div class="panel"><div class="q-prompt">' + esc(L.t) + (ex.ai ? ' · exercices de Claude' : '') + '</div>' +
      '<p style="font-size:1.25rem;font-weight:700;margin:4px 0 16px">' + esc(q.q) + '</p><div class="options">' +
      q.opts.map((o, k) => {
        let cls = 'opt';
        if (ex.answered !== null){ if (o === q.a) cls += ' right'; else if (k === ex.answered) cls += ' wrong'; }
        return '<button class="' + cls + '" data-act="g-answer" data-k="' + k + '"' + (ex.answered !== null ? ' disabled' : '') + '>' + esc(o) + '</button>';
      }).join('') + '</div>' +
      (ex.answered !== null ? '<p style="margin:14px 0 0">' + (q.opts[ex.answered] === q.a ? '<b style="color:var(--good)">Bonne réponse !</b>' : '<b style="color:var(--bad)">La bonne réponse :</b> ' + esc(q.a)) + '</p>' +
        '<div class="row" style="margin-top:14px">' + (canSpeak ? '<button class="btn ghost" data-act="say" data-text="' + esc(q.q.replace('___', q.a)) + '">🔊 Écouter</button>' : '') +
        '<button class="btn primary" data-act="g-next">' + (ex.i === n - 1 ? 'Voir mon score' : 'Question suivante') + '</button></div>' : '') +
      '</div><p class="muted small">Question ' + (ex.i + 1) + ' sur ' + n + ' <button class="linkish" data-act="g-lesson" style="margin-left:8px">Revoir la règle</button></p>';
    return;
  }
  el.innerHTML = '<button class="linkish" data-act="g-back">← Toutes les leçons</button>' +
    '<div class="panel" style="margin-top:8px"><div class="q-prompt">' + f.k + ' · Grammaire</div><h2 style="margin-top:2px">' + esc(L.t) + '</h2>' +
    L.r.map(p => '<p>' + esc(p) + '</p>').join('') +
    '<div class="examples">' + L.e.map(x => '<div class="exl"><span class="hand">' + esc(x) + '</span>' + (canSpeak ? '<button class="icon-btn" data-act="say" data-text="' + esc(x) + '" aria-label="Écouter">🔊</button>' : '') + '</div>').join('') + '</div>' +
    '<div class="row" style="margin-top:16px"><button class="btn primary" data-act="g-start">S’entraîner (' + L.x.length + ' questions)</button></div>' +
    (sample ? '<div class="row" style="margin-top:10px"><button class="btn" data-act="g-more"' + (gram.loading ? ' disabled' : '') + '>' + (gram.loading ? 'Claude prépare tes exercices…' : '5 nouveaux exercices avec Claude') + '</button></div>' : '') +
    (gram.error ? '<p class="err">' + esc(gram.error) + '</p>' : '') + '</div>';
}
async function genGrammar(f){
  gram.loading = true; gram.error = ''; renderGrammar();
  try {
    const out = await sample.json(
      'Create 5 new multiple-choice grammar exercises for a French speaker learning English at CEFR level ' + f.k + '. Grammar point: ' + f.L.t + ' (' + f.L.s + '). Rule summary in French: ' + f.L.r.join(' ') +
      ' Each exercise is one English sentence with a single gap written ___ and exactly 4 options: the first option is the only correct answer, the three others are clearly wrong. Vary the vocabulary and situations, and do not reuse these sentences: ' + f.L.x.map(x => x[0]).join(' | ') +
      '. Return only a JSON array of 5 objects: {"q": string, "o": [correct, wrong, wrong, wrong]}.', { modelTier: 'quick', cache: false });
    const items = (Array.isArray(out) ? out : (out && out.exercises) || [])
      .filter(x => x && x.q && Array.isArray(x.o) && x.o.length === 4 && new Set(x.o.map(String)).size === 4)
      .map(x => [String(x.q)].concat(x.o.map(String))).slice(0, 5);
    gram.loading = false;
    if (gram.id !== f.L.id) return;
    if (!items.length){ gram.error = 'Aucun exercice reçu. Réessaie.'; return renderGrammar(); }
    startGrammarEx(items); gram.ex.ai = true; renderGrammar();
  } catch(e){ gram.loading = false; gram.error = sampleError(e); renderGrammar(); }
}

// ---------- Conversation ----------
const TOPICS = ['Se présenter','Au restaurant','En voyage','Au travail','Mes loisirs','Sujet libre'];
const TOPIC_EN = {'Se présenter':'introducing yourself','Au restaurant':'ordering at a restaurant','En voyage':'travelling abroad','Au travail':'everyday life at work','Mes loisirs':'hobbies and free time','Sujet libre':'anything the learner wants'};
let chat = { topic: null, msgs: [], loading: false, error: '' };
function renderChat(){
  const el = $('tab-parler');
  if (!sampleChecked){ el.innerHTML = '<div class="panel empty"><p class="muted">Chargement…</p></div>'; return; }
  if (!sample){
    el.innerHTML = '<div class="panel empty"><div class="big">Conversation</div><p>La conversation avec l’IA, les listes par thème générées par Claude et les exercices de grammaire supplémentaires ne sont pas disponibles dans la version hors ligne.</p><p>Pour discuter en anglais, ouvre la version Claude de l’app (connexion internet nécessaire).</p><a class="btn primary" style="display:inline-block;text-decoration:none;line-height:22px" href="https://claude.ai/artifact/87UKEBmq4RVgY3bX8mSSha" target="_blank" rel="noopener">Ouvrir la version Claude</a></div>';
    return;
  }
  const lv = lvl();
  let html = '<div class="panel"><h2 style="margin-top:0">Discuter en anglais</h2>' +
    '<label for="f-level">Mon niveau</label><select id="f-level">' + LEVEL_KEYS.map(l => '<option value="' + l + '"' + (l === lv ? ' selected' : '') + '>' + l + ' – ' + LEVELS[l].name + '</option>').join('') + '</select>' +
    '<label>Choisis un sujet pour commencer</label><div class="chips">' + TOPICS.map(t => '<button class="chip' + (chat.topic === t ? ' on' : '') + '" data-act="topic" data-t="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div></div>';
  if (chat.topic){
    html += '<div class="chat" id="chat">' + chat.msgs.map((m, k) => {
      if (m.role === 'me') return '<div class="msg me">' + esc(m.text) + '</div>' + (m.better ? '<div class="fix"><b>Plus naturel : ' + esc(m.better) + '</b>' + esc(m.correction) + '</div>' : '');
      return '<div class="msg tutor">' + esc(m.text) + '<div class="tools">' +
        (canSpeak ? '<button class="linkish" data-act="say" data-text="' + esc(m.text) + '">🔊 Écouter</button>' : '') +
        (m.translation ? '<button class="linkish" data-act="trans" data-k="' + k + '">' + (m.showTrans ? 'Masquer la traduction' : 'Voir la traduction') + '</button>' : '') +
        '</div>' + (m.showTrans ? '<div class="trans">' + esc(m.translation) + '</div>' : '') + '</div>';
    }).join('') + (chat.loading ? '<div class="msg tutor muted">…</div>' : '') + '</div>' +
    (chat.error ? '<p class="err">' + esc(chat.error) + '</p>' : '') +
    '<div class="composer"><textarea id="f-msg" rows="2" placeholder="Écris en anglais (ou en français si tu bloques)" aria-label="Ton message"></textarea>' +
    '<button class="btn primary" data-act="send"' + (chat.loading ? ' disabled' : '') + '>Envoyer</button></div>' +
    '<p class="muted small" style="margin-top:8px">Astuce : utilise la dictée du clavier de ton téléphone pour t’entraîner à l’oral.</p>';
  }
  el.innerHTML = html;
  const c = $('chat'); if (c && chat.msgs.length) c.lastElementChild.scrollIntoView({ block: 'nearest' });
}
async function tutorTurn(){
  chat.loading = true; chat.error = ''; renderChat();
  const transcript = chat.msgs.slice(-14).map(m => (m.role === 'me' ? 'Learner: ' : 'Tutor: ') + m.text).join('\n');
  const prompt =
    'You are a warm, patient English tutor chatting with a French speaker. Learner level: ' + LEVELS[lvl()].en + ' Conversation topic: ' + TOPIC_EN[chat.topic] + '.\n' +
    'Rules: write your reply in natural English adapted to the level (1 to 3 short sentences; simpler for beginners) and end with a question to keep the conversation going. ' +
    'Check ONLY the learner\'s last message: if it has a grammar, vocabulary or naturalness mistake, set "better" to the corrected English sentence and "correction" to a one-sentence explanation in French; if it is correct, set both to "". ' +
    'If the learner wrote in French, set "better" to how to say it in English and "correction" to a short French note. ' +
    'Always set "translation" to a French translation of your reply.\n' +
    (transcript ? 'Conversation so far:\n' + transcript + '\n' : 'The conversation has not started: greet the learner and open the topic with a question. Set "better" and "correction" to "".\n') +
    'Return only JSON: {"reply": string, "translation": string, "better": string, "correction": string}';
  try {
    const out = await sample.json(prompt, { modelTier: 'quick', cache: false });
    const last = chat.msgs[chat.msgs.length - 1];
    if (last && last.role === 'me' && out && out.better && out.better.trim() && out.better.trim() !== last.text.trim()){ last.better = out.better; last.correction = out.correction || ''; }
    chat.msgs.push({ role: 'tutor', text: (out && out.reply) || '…', translation: (out && out.translation) || '' });
  } catch(e){ chat.error = sampleError(e); }
  chat.loading = false;
  if (current === 'parler') renderChat();
}

// ---------- Événements ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'say'){ e.stopPropagation(); speak(t.dataset.text); return; }
  if (act === 'goto') return show(t.dataset.to);
  if (act === 'start'){ session = null; startSession(); return renderReview(); }
  if (act === 'reveal'){ if (session && !session.revealed){ session.revealed = true; renderReview(); } return; }
  if (act === 'grade') return grade(t.dataset.g);
  if (act === 'quiz-start'){ newQuiz(); return renderQuiz(); }
  if (act === 'answer') return answer(+t.dataset.k);
  if (act === 'quiz-next'){ quiz.i++; quiz.answered = null; return renderQuiz(); }
  if (act === 'add'){
    const en = $('f-en').value.trim(), fr = $('f-fr').value.trim(), ex = $('f-ex').value.trim();
    if (!en || !fr){ $('add-msg').textContent = 'Remplis le mot en anglais et sa traduction.'; return; }
    if (state.words.some(w => w.en.toLowerCase() === en.toLowerCase())){ $('add-msg').textContent = '« ' + en + ' » est déjà dans ta liste.'; return; }
    state.words.push(mkWord(en, fr, ex)); save(); renderWords();
    $('add-msg').textContent = '« ' + en + ' » ajouté. Il apparaîtra dans ta prochaine révision.';
    $('f-en').focus(); return;
  }
  if (act === 'del'){
    const w = state.words.find(x => x.id === t.dataset.id);
    if (w && confirm('Supprimer « ' + w.en + ' » ?')){ state.words = state.words.filter(x => x.id !== w.id); save(); renderWords(); }
    return;
  }
  if (act === 'reset'){
    if (confirm('Remettre à zéro ta progression et ta liste de mots ?')){
      const keep = state.settings; state = freshState(); state.settings = keep; if (keep.level) addPack(keep.level); session = null; quiz = null; save(); renderAll();
    }
    return;
  }
  if (act === 'list-level'){ listLevel = t.dataset.l; return renderWords(); }
  if (act === 'add-list'){
    const l = t.dataset.l, li = allLists(l)[+t.dataset.i];
    const n = addWords(li.w, l);
    if (+t.dataset.i === 0 && !state.packs.includes(l)) state.packs.push(l);
    save(); renderWords();
    const m = $('list-msg'); if (m) m.textContent = '✓ ' + n + ' mot' + (n > 1 ? 's' : '') + ' de « ' + li.n + ' » ajouté' + (n > 1 ? 's' : '') + ' à tes révisions.';
    return;
  }
  if (act === 'g-level'){ gram.level = t.dataset.l; return renderGrammar(); }
  if (act === 'g-open'){ gram.id = t.dataset.id; gram.ex = null; gram.error = ''; renderGrammar(); window.scrollTo(0, 0); return; }
  if (act === 'g-back'){ gram.id = null; gram.ex = null; gram.error = ''; renderGrammar(); window.scrollTo(0, 0); return; }
  if (act === 'g-lesson'){ gram.ex = null; renderGrammar(); window.scrollTo(0, 0); return; }
  if (act === 'g-start'){ const f = findLesson(gram.id); if (f) startGrammarEx(f.L.x); return; }
  if (act === 'g-more'){ const f = findLesson(gram.id); if (f && sample && !gram.loading) genGrammar(f); return; }
  if (act === 'g-answer'){
    const ex = gram.ex; if (!ex || ex.answered !== null) return;
    ex.answered = +t.dataset.k; if (ex.qs[ex.i].opts[ex.answered] === ex.qs[ex.i].a) ex.score++;
    return renderGrammar();
  }
  if (act === 'g-next'){
    const ex = gram.ex; ex.i++; ex.answered = null;
    if (ex.i >= ex.qs.length){
      if (!ex.ai) state.grammar[gram.id] = Math.max(state.grammar[gram.id] || 0, ex.score);
      markActivity(); save();
    }
    renderGrammar(); window.scrollTo(0, 0); return;
  }
  if (act === 'export'){
    const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mon-anglais-progression-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    $('io-msg').textContent = 'Fichier exporté. Retrouve-le dans l’app Fichiers, dossier Téléchargements.';
    return;
  }
  if (act === 'import'){ $('f-import').click(); return; }
  if (act === 'pl-start') return startPlacement();
  if (act === 'pl-answer') return plAnswer(t.dataset.o);
  if (act === 'pl-close'){ placement = null; return render(current); }
  if (act === 'pl-apply'){
    const r = placement.result, first = !state.settings.level;
    state.settings.level = r; placement = null;
    if (first){ addPack(r); session = null; }
    save(); return render(current);
  }
  if (act === 'pick-level'){
    const first = !state.settings.level;
    state.settings.level = t.dataset.l;
    if (first){ addPack(t.dataset.l); session = null; }
    save(); return render(current);
  }
  if (act === 'add-pack'){
    const n = addPack(lvl()); save(); renderWords();
    $('add-msg').textContent = n + ' mot' + (n > 1 ? 's' : '') + ' du niveau ' + lvl() + ' ajouté' + (n > 1 ? 's' : '') + '. Ils apparaîtront dans ta prochaine révision.';
    return;
  }
  if (act === 'gen') return generate();
  if (act === 'gen-clear'){ gen = null; return renderWords(); }
  if (act === 'gen-add'){
    let n = 0;
    gen.items.forEach((it, k) => {
      const box = $('g' + k);
      if (box && box.checked && !state.words.some(w => w.en.toLowerCase() === String(it.en).toLowerCase())){ state.words.push(mkWord(String(it.en), String(it.fr), String(it.ex || ''), lvl())); n++; }
    });
    gen = null; save(); renderWords();
    $('add-msg').textContent = n + ' mot' + (n > 1 ? 's' : '') + ' ajouté' + (n > 1 ? 's' : '') + ' à ta liste.';
    return;
  }
  if (act === 'topic'){ chat = { topic: t.dataset.t, msgs: [], loading: false, error: '' }; return tutorTurn(); }
  if (act === 'trans'){ const m = chat.msgs[+t.dataset.k]; m.showTrans = !m.showTrans; return renderChat(); }
  if (act === 'send'){
    const box = $('f-msg'); const text = box.value.trim(); if (!text || chat.loading) return;
    chat.msgs.push({ role: 'me', text }); return tutorTurn();
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'f-msg' && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); const b = document.querySelector('[data-act="send"]'); if (b) b.click(); }
  if (e.target.classList && e.target.classList.contains('card') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); if (session && !session.revealed){ session.revealed = true; renderReview(); } }
  if (['f-en','f-fr','f-ex'].includes(e.target.id) && e.key === 'Enter'){ e.preventDefault(); document.querySelector('[data-act="add"]').click(); }
  if (e.target.id === 'f-theme' && e.key === 'Enter'){ e.preventDefault(); generate(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-search'){ filter = e.target.value; const pos = e.target.selectionStart; renderWords(); const s = $('f-search'); s.focus(); s.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-import' && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => {
      let data = null;
      try { data = migrate(JSON.parse(r.result)); } catch(err){ data = null; }
      if (!data){ $('io-msg').textContent = 'Ce fichier n’est pas une sauvegarde de Mon anglais.'; return; }
      if (!confirm('Remplacer la progression de cet appareil par celle du fichier (' + data.words.length + ' mots) ?')) return;
      state = data; session = null; quiz = null; save(); renderAll();
      const m = $('io-msg'); if (m) m.textContent = 'Progression importée.';
    };
    r.readAsText(e.target.files[0]);
    e.target.value = '';
  }
  if (e.target.id === 'f-accent'){ state.settings.accent = e.target.value; save(); speak('Hello! This is how I sound.'); }
  if (e.target.id === 'f-level'){ state.settings.level = e.target.value; save(); }
});
if (canSpeak) speechSynthesis.onvoiceschanged = () => {};

// ---------- Démarrage ----------
const start = location.hash.slice(1);
show(TABS.includes(start) ? start : 'reviser');
renderStats();
sample = null; sampleChecked = true;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
